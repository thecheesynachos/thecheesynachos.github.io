<!DOCTYPE html>
<html>

  {% include head.html %}

  <!--
    Full-window layout for the games (map_game, singapointing): no header, title or
    footer, the game fills the browser. The game's own CSS does the filling, keyed on
    body.game-page.
  -->
  <body class="game-page">
    <style>
      html { overflow: hidden; }
      body.game-page { margin: 0; height: 100%; overflow: hidden; background: #1d1b26; }
      /* the visitor counter still loads and counts the visit, it's just parked off-screen */
      .game-page-tracker { position: fixed; left: -10000px; top: 0; width: 300px; height: 200px;
        overflow: hidden; opacity: 0; pointer-events: none; }
    </style>

    {{ content }}

    <div class="game-page-tracker" aria-hidden="true">{% include visitor-tracker.html %}</div>
    <script>
      // Once the hidden widget has loaded, read its view count (site-wide, last 30 days, e.g.
      // "298 Pageviews") and hand it to the game, which shows it in its own style:
      // window.SITE_VISITS = { count, text, range } plus a "sitevisits" event on document.
      // If the widget never loads, nothing happens and the game shows nothing.
      (function () {
        var tries = 0;
        (function poll() {
          var el = document.querySelector("#mapmyvisitors-widget .mapmyvisitors-visitors");
          var m = el && el.textContent.match(/\d[\d,]*/);
          if (m) {
            var d = document.querySelector("#mapmyvisitors-widget .mapmyvisitors-date");
            window.SITE_VISITS = { count: parseInt(m[0].replace(/,/g, ""), 10),
              text: el.textContent.trim(), range: d ? d.textContent.trim() : "" };
            document.dispatchEvent(new CustomEvent("sitevisits", { detail: window.SITE_VISITS }));
          } else if (++tries < 60) setTimeout(poll, 500);   // give up after ~30 s
        })();
      })();
    </script>
  </body>

</html>
